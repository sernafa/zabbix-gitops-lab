x-labels: &labels
  zabbix.gitops-lab.owner: "${LAB_ID:?Ejecuta los scripts del laboratorio}"
x-db: &db
  DB_SERVER_HOST: postgres
  POSTGRES_DB: zabbix
  POSTGRES_USER: zabbix
  POSTGRES_PASSWORD: lab-only-zabbix
services:
  postgres:
    image: ${POSTGRES_IMAGE}
    labels: *labels
    environment: *db
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U zabbix -d zabbix']
      interval: 5s
      timeout: 3s
      retries: 60
  server:
    image: ${ZABBIX_SERVER_IMAGE}
    labels: *labels
    environment: *db
    networks:
      default:
        aliases: [zabbix-server]
    depends_on:
      postgres: {condition: service_healthy}
  web:
    image: ${ZABBIX_WEB_IMAGE}
    labels: *labels
    environment:
      <<: *db
      ZBX_SERVER_HOST: zabbix-server
      PHP_TZ: Europe/Madrid
    ports:
      - "127.0.0.1:${ZABBIX_WEB_PORT}:8080"
    depends_on:
      postgres: {condition: service_healthy}
      server: {condition: service_started}
volumes:
  postgres:
    labels: *labels
networks:
  default:
    external: true
    name: zabbix-gitops-lab
